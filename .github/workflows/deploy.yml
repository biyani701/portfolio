name: Deploy to Production
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      # Portfolio Build and Setup
      - name: Install portfolio dependencies
        run: npm ci

      - name: Build the portfolio project
        run: npm run build
        env:
          REACT_APP_GITHUB_CLIENT_ID: ${{ vars.REACT_APP_GITHUB_CLIENT_ID }}
          REACT_APP_REDIRECT_URI: ${{ vars.REACT_APP_REDIRECT_URI }}
          REACT_APP_TOKEN_PROXY_URL: ${{ vars.REACT_APP_TOKEN_PROXY_URL }}

      # Docusaurus Setup and Build
      - name: Setup Docusaurus
        run: |
          npx create-docusaurus@latest docs-site classic --yes --skip-install 
          mkdir -p docs-site/docs
          mkdir -p docs-site/static/img

          # Copy docs content if it exists
          if [ -d "docs/docs" ]; then
            cp -r docs/docs/* docs-site/docs/
          fi

          # Copy config files if they exist
          if [ -f "docs/docusaurus.config.js" ]; then
            cp docs/docusaurus.config.js docs-site/
          fi

          if [ -f "docs/sidebars.js" ]; then
            cp docs/sidebars.js docs-site/
          fi

          # List directories for debugging
          echo "Contents of docs directory:"
          ls -la docs/
          echo "Contents of docs-site directory:"
          ls -la docs-site/

      - name: Install Docusaurus dependencies
        run: |
          cd docs-site
          npm install

      - name: Build Docusaurus
        run: |
          cd docs-site
          npm run build || echo "Docusaurus build failed but continuing deployment"

      # Combined Deployment
      - name: Prepare combined deployment
        run: |
          # Create docs directory in build
          mkdir -p build/docs

          # Check if Docusaurus build exists and copy it
          if [ -d "docs-site/build" ]; then
            echo "Copying Docusaurus build to build/docs"
            cp -r docs-site/build/* build/docs/ || echo "Warning: Could not copy Docusaurus build"
          else
            echo "Warning: Docusaurus build directory not found"
            # Use fallback index.html if it exists
            if [ -f "docs/fallback-index.html" ]; then
              echo "Using fallback index.html"
              cp docs/fallback-index.html build/docs/index.html
            else
              # Create a simple placeholder page
              echo "<html><head><title>Documentation</title></head><body><h1>Documentation</h1><p>Documentation is being set up. Please check back later.</p></body></html>" > build/docs/index.html
            fi
          fi

          # List contents for debugging
          echo "Contents of build/docs directory:"
          ls -la build/docs/ || echo "Could not list build/docs directory"

      - name: Deploy to production server
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: vishal.biyani.xyz
