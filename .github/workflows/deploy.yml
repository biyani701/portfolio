name: Deploy to Production
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.10.0"

      # Portfolio Build and Setup
      - name: Install portfolio dependencies
        run: npm ci

      - name: Build the portfolio project
        run: npm run build
        env:
          REACT_APP_GITHUB_CLIENT_ID: ${{ vars.REACT_APP_GITHUB_CLIENT_ID }}
          REACT_APP_REDIRECT_URI: ${{ vars.REACT_APP_REDIRECT_URI }}
          REACT_APP_TOKEN_PROXY_URL: ${{ vars.REACT_APP_TOKEN_PROXY_URL }}

      # Copy 404.html to build folder for main site
      - name: Copy 404.html for main site
        run: |
          if [ -f "public/404.html" ]; then
            echo "Copying 404.html from public directory"
            cp public/404.html build/
          else
            echo "Creating 404.html in build directory"
            cat > build/404.html <<"EOF"
            <!DOCTYPE html>
            <html>
              <head>
                <meta charset="utf-8" />
                <script type="text/javascript">
                  (function () {
                    const search = window.location.search;
                    const params = new URLSearchParams(search);
                    const redirect = params.get("redirect") || "/";
                    window.location.replace(redirect);
                  })();
                </script>
              </head>
              <body>
                <p>Redirecting... If you are not redirected automatically, <a href="/">click here</a>.</p>
              </body>
            </html>
          EOF
          fi


      # Create docs directory and basic index.html
      - name: Create basic docs index
        run: |
          mkdir -p build/docs
          cat > build/docs/index.html <<"EOF"
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="0;url=/docs/">
            <title>Portfolio Documentation</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 20px;
                text-align: center;
              }
              .loading {
                display: inline-block;
                margin-top: 20px;
              }
              .loading:after {
                content: " .";
                animation: dots 1.5s steps(5, end) infinite;
              }
              @keyframes dots {
                0%, 20% { content: " ."; }
                40% { content: " .."; }
                60% { content: " ..."; }
                80%, 100% { content: " ...."; }
              }
            </style>
          </head>
          <body>
            <h1>Portfolio Documentation</h1>
            <p>Loading documentation<span class="loading"></span></p>
            <p>If you are not redirected automatically, <a href="/docs/">click here</a>.</p>
          </body>
          </html>
          EOF

      # Docusaurus Setup and Build
      - name: Setup Docusaurus
        run: |
          echo "Creating Docusaurus site..."
          pwd
          npx create-docusaurus@3.7.0 docs-site classic --skip-install --javascript
          echo "Checking necessary directories"
          find docs-site -type d | sort
          # echo "Creating necessary directories..."
          # mkdir -p docs-site/docs
          # mkdir -p docs-site/static/img
          # mkdir -p docs-site/src/css
          mkdir -p docs-site/static/js

          # Create docusaurus-router.js for handling navigation
          cat > docs-site/static/js/docusaurus-router.js <<"EOF"
          // This script helps with handling client-side routing within Docusaurus
          (function() {
            console.log('📚 Docusaurus router script loaded');

            // Check if we're in the docs section
            if (window.location.pathname.startsWith('/docs/')) {
              console.log('✅ Initialized docusaurus router');

              // Add a listener for handle Docusaurus navigation
              window.addEventListener('load', function() {
                console.log('🔄 Docusaurus page loaded completely');
              });
            }
          })();
          EOF

          # Create theme-init.js for initializing theme from cookies
          mkdir -p docs-site/static/js
          cat > docs-site/static/js/theme-init.js <<"EOF"
          // This script initializes the theme based on cookies before the page loads
          // to prevent theme flashing
          (function() {
            function getCookie(name) {
              const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
              return match ? match[2] : null;
            }

            // Try to get theme from cookie
            const themeCookie = getCookie('themeMode');

            // If cookie exists, set the theme
            if (themeCookie) {
              document.documentElement.setAttribute('data-theme', themeCookie);
              console.log('Theme initialized from cookie:', themeCookie);
            } else {
              // Default to light theme if no cookie exists
              document.documentElement.setAttribute('data-theme', 'light');
            }
          })();
          EOF

          # Copy docs content if it exists
          if [ -d "docs/docs" ]; then
            echo "Copying docs content..."
            cp -r docs/docs/* docs-site/docs/
          else
            echo "Creating docs content..."

            # Create necessary directories
            mkdir -p docs-site/docs/policies
            mkdir -p docs-site/docs/architecture
            mkdir -p docs-site/docs/libraries
            mkdir -p docs-site/docs/sbom
            mkdir -p docs-site/docs/development

            # Create a basic intro file
            echo '---' > docs-site/docs/intro.md
            echo 'sidebar_position: 1' >> docs-site/docs/intro.md
            echo '---' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '# Portfolio Documentation' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo 'Welcome to the documentation for the Portfolio project. This documentation provides detailed information about the architecture, libraries, and components used in the project.' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Overview' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo 'The Portfolio project is a personal website built with React and Material-UI. It showcases skills, experience, projects, and blog posts. The site is designed to be responsive, accessible, and user-friendly.' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Features' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '- **Resume Sections**: Display professional information including skills, experience, education, and certifications' >> docs-site/docs/intro.md
            echo '- **Blog**: Create, view, edit, and delete blog posts with a rich text editor' >> docs-site/docs/intro.md
            echo '- **Knowledge Base**: Share domain knowledge and glossary terms' >> docs-site/docs/intro.md
            echo '- **Authentication**: Secure access to protected routes with Auth.js' >> docs-site/docs/intro.md
            echo '- **Responsive Design**: Optimized for all screen sizes' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Technology Stack' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '- **Frontend**: React, Material-UI, Slate.js' >> docs-site/docs/intro.md
            echo '- **Authentication**: Auth.js' >> docs-site/docs/intro.md
            echo '- **Deployment**: GitHub Pages' >> docs-site/docs/intro.md
            echo '- **Documentation**: Docusaurus' >> docs-site/docs/intro.md

            # Create architecture overview
            echo '---' > docs-site/docs/architecture/overview.md
            echo 'sidebar_position: 1' >> docs-site/docs/architecture/overview.md
            echo 'title: Architecture Overview' >> docs-site/docs/architecture/overview.md
            echo '---' >> docs-site/docs/architecture/overview.md
            echo '' >> docs-site/docs/architecture/overview.md
            echo '# Architecture Overview' >> docs-site/docs/architecture/overview.md
            echo '' >> docs-site/docs/architecture/overview.md
            echo 'This document provides an overview of the portfolio project architecture.' >> docs-site/docs/architecture/overview.md
            echo '' >> docs-site/docs/architecture/overview.md
            echo '```mermaid' >> docs-site/docs/architecture/overview.md
            echo 'flowchart TD' >> docs-site/docs/architecture/overview.md
            echo '    A[User] -->|Visits| B[GitHub Pages]' >> docs-site/docs/architecture/overview.md
            echo '    B -->|Loads| C[React App]' >> docs-site/docs/architecture/overview.md
            echo '    C -->|Authentication| D[Auth.js Server]' >> docs-site/docs/architecture/overview.md
            echo '    C -->|Routing| E[React Router]' >> docs-site/docs/architecture/overview.md
            echo '    E -->|Public Routes| F[Home/Resume]' >> docs-site/docs/architecture/overview.md
            echo '    E -->|Protected Routes| G[Admin/Blog Editor]' >> docs-site/docs/architecture/overview.md
            echo '```' >> docs-site/docs/architecture/overview.md

            # Create MUI library doc
            echo '---' > docs-site/docs/libraries/mui.md
            echo 'sidebar_position: 1' >> docs-site/docs/libraries/mui.md
            echo 'title: Material-UI' >> docs-site/docs/libraries/mui.md
            echo '---' >> docs-site/docs/libraries/mui.md
            echo '' >> docs-site/docs/libraries/mui.md
            echo '# Material-UI (MUI)' >> docs-site/docs/libraries/mui.md
            echo '' >> docs-site/docs/libraries/mui.md
            echo 'Material-UI is the primary UI library used in the portfolio project.' >> docs-site/docs/libraries/mui.md

            # Create SBOM dependencies doc
            echo '---' > docs-site/docs/sbom/dependencies.md
            echo 'sidebar_position: 1' >> docs-site/docs/sbom/dependencies.md
            echo 'title: Dependencies' >> docs-site/docs/sbom/dependencies.md
            echo '---' >> docs-site/docs/sbom/dependencies.md
            echo '' >> docs-site/docs/sbom/dependencies.md
            echo '# Software Bill of Materials (SBOM)' >> docs-site/docs/sbom/dependencies.md
            echo '' >> docs-site/docs/sbom/dependencies.md
            echo 'This document provides a comprehensive list of dependencies used in the portfolio project.' >> docs-site/docs/sbom/dependencies.md

            # Create ESLint version doc
            echo '---' > docs-site/docs/development/eslint-version.md
            echo 'sidebar_position: 1' >> docs-site/docs/development/eslint-version.md
            echo 'title: ESLint Version' >> docs-site/docs/development/eslint-version.md
            echo '---' >> docs-site/docs/development/eslint-version.md
            echo '' >> docs-site/docs/development/eslint-version.md
            echo '# ESLint Version Explanation' >> docs-site/docs/development/eslint-version.md
            echo '' >> docs-site/docs/development/eslint-version.md
            echo '## Current Version' >> docs-site/docs/development/eslint-version.md
            echo '' >> docs-site/docs/development/eslint-version.md
            echo 'The portfolio project uses ESLint version `^8.34.0` as specified in the dependencies.' >> docs-site/docs/development/eslint-version.md
            echo '' >> docs-site/docs/development/eslint-version.md
            echo '## Why Not the Latest Version?' >> docs-site/docs/development/eslint-version.md
            echo '' >> docs-site/docs/development/eslint-version.md
            echo 'ESLint version 8.57.1 has been deprecated by the ESLint team. When running npm install or npm update, you might see the following warning:' >> docs-site/docs/development/eslint-version.md
            echo '' >> docs-site/docs/development/eslint-version.md
            echo '```bash' >> docs-site/docs/development/eslint-version.md
            echo 'npm warn deprecated eslint@8.57.1: This version is no longer supported. Please see https://eslint.org/version-support for other options.' >> docs-site/docs/development/eslint-version.md
            echo '```' >> docs-site/docs/development/eslint-version.md

            # Create policy pages
            # Privacy Policy
            echo '---' > docs-site/docs/policies/privacy-policy.mdx
            echo 'sidebar_position: 1' >> docs-site/docs/policies/privacy-policy.mdx
            echo 'title: Privacy Policy' >> docs-site/docs/policies/privacy-policy.mdx
            echo '---' >> docs-site/docs/policies/privacy-policy.mdx
            echo '' >> docs-site/docs/policies/privacy-policy.mdx
            echo '# Privacy Policy' >> docs-site/docs/policies/privacy-policy.mdx
            echo '' >> docs-site/docs/policies/privacy-policy.mdx
            echo '*Last updated: June 2023*' >> docs-site/docs/policies/privacy-policy.mdx
            echo '' >> docs-site/docs/policies/privacy-policy.mdx
            echo '## Introduction' >> docs-site/docs/policies/privacy-policy.mdx
            echo '' >> docs-site/docs/policies/privacy-policy.mdx
            echo 'Your privacy is important to us. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our website.' >> docs-site/docs/policies/privacy-policy.mdx
            echo '' >> docs-site/docs/policies/privacy-policy.mdx
            echo '```mermaid' >> docs-site/docs/policies/privacy-policy.mdx
            echo 'flowchart TD' >> docs-site/docs/policies/privacy-policy.mdx
            echo '    A[User Visits Website] --> B{Cookie Consent?}' >> docs-site/docs/policies/privacy-policy.mdx
            echo '    B -->|Yes| C[Set Cookies]' >> docs-site/docs/policies/privacy-policy.mdx
            echo '    B -->|No| D[Essential Cookies Only]' >> docs-site/docs/policies/privacy-policy.mdx
            echo '    C --> E[Analytics & Preferences]' >> docs-site/docs/policies/privacy-policy.mdx
            echo '    D --> F[Basic Functionality]' >> docs-site/docs/policies/privacy-policy.mdx
            echo '```' >> docs-site/docs/policies/privacy-policy.mdx

            # Terms of Use
            echo '---' > docs-site/docs/policies/terms-of-use.mdx
            echo 'sidebar_position: 2' >> docs-site/docs/policies/terms-of-use.mdx
            echo 'title: Terms of Use' >> docs-site/docs/policies/terms-of-use.mdx
            echo '---' >> docs-site/docs/policies/terms-of-use.mdx
            echo '' >> docs-site/docs/policies/terms-of-use.mdx
            echo '# Terms of Use' >> docs-site/docs/policies/terms-of-use.mdx
            echo '' >> docs-site/docs/policies/terms-of-use.mdx
            echo '*Last updated: June 2023*' >> docs-site/docs/policies/terms-of-use.mdx
            echo '' >> docs-site/docs/policies/terms-of-use.mdx
            echo '## Introduction' >> docs-site/docs/policies/terms-of-use.mdx
            echo '' >> docs-site/docs/policies/terms-of-use.mdx
            echo 'By accessing and using this website, you agree to be bound by these Terms of Use, all applicable laws and regulations, and agree that you are responsible for compliance with any applicable local laws.' >> docs-site/docs/policies/terms-of-use.mdx

            # Security Policy
            echo '---' > docs-site/docs/policies/security-policy.mdx
            echo 'sidebar_position: 3' >> docs-site/docs/policies/security-policy.mdx
            echo 'title: Security Policy' >> docs-site/docs/policies/security-policy.mdx
            echo '---' >> docs-site/docs/policies/security-policy.mdx
            echo '' >> docs-site/docs/policies/security-policy.mdx
            echo '# Security Policy' >> docs-site/docs/policies/security-policy.mdx
            echo '' >> docs-site/docs/policies/security-policy.mdx
            echo '*Last updated: June 2023*' >> docs-site/docs/policies/security-policy.mdx
            echo '' >> docs-site/docs/policies/security-policy.mdx
            echo '## Our Commitment to Security' >> docs-site/docs/policies/security-policy.mdx
            echo '' >> docs-site/docs/policies/security-policy.mdx
            echo 'We are committed to ensuring the security of our website and protecting your information.' >> docs-site/docs/policies/security-policy.mdx

            # Cookie Policy
            echo '---' > docs-site/docs/policies/cookie-policy.mdx
            echo 'sidebar_position: 4' >> docs-site/docs/policies/cookie-policy.mdx
            echo 'title: Cookie Policy' >> docs-site/docs/policies/cookie-policy.mdx
            echo '---' >> docs-site/docs/policies/cookie-policy.mdx
            echo '' >> docs-site/docs/policies/cookie-policy.mdx
            echo '# Cookie Policy' >> docs-site/docs/policies/cookie-policy.mdx
            echo '' >> docs-site/docs/policies/cookie-policy.mdx
            echo '*Last updated: June 2023*' >> docs-site/docs/policies/cookie-policy.mdx
            echo '' >> docs-site/docs/policies/cookie-policy.mdx
            echo '## What Are Cookies' >> docs-site/docs/policies/cookie-policy.mdx
            echo '' >> docs-site/docs/policies/cookie-policy.mdx
            echo 'Cookies are small pieces of text sent to your web browser by a website you visit.' >> docs-site/docs/policies/cookie-policy.mdx

            # EULA
            echo '---' > docs-site/docs/policies/eula.mdx
            echo 'sidebar_position: 5' >> docs-site/docs/policies/eula.mdx
            echo 'title: End User License Agreement (EULA)' >> docs-site/docs/policies/eula.mdx
            echo '---' >> docs-site/docs/policies/eula.mdx
            echo '' >> docs-site/docs/policies/eula.mdx
            echo '# End User License Agreement (EULA)' >> docs-site/docs/policies/eula.mdx
            echo '' >> docs-site/docs/policies/eula.mdx
            echo '*Last updated: June 2023*' >> docs-site/docs/policies/eula.mdx
            echo '' >> docs-site/docs/policies/eula.mdx
            echo '## Introduction' >> docs-site/docs/policies/eula.mdx
            echo '' >> docs-site/docs/policies/eula.mdx
            echo 'This End User License Agreement ("EULA") is a legal agreement between you and the website owner regarding your use of the website and any associated content, features, or services.' >> docs-site/docs/policies/eula.mdx
          fi

          # Update docusaurus.config.js with proper settings
          cat > docs-site/docusaurus.config.js <<"EOF"
          // @ts-check
          // `@type` JSDoc annotations allow editor autocompletion and type checking
          // (when paired with `@ts-check`).

          // Note: type annotations allow type checking and IDEs autocompletion

          import { themes as prismThemes } from 'prism-react-renderer';

          const lightCodeTheme = prismThemes.github;
          const darkCodeTheme = prismThemes.dracula;

          /** @type {import('@docusaurus/types').Config} */
          const config = {
            title: 'Portfolio Documentation',
            tagline: 'Documentation for the portfolio project',
            url: 'https://vishal.biyani.xyz',
            baseUrl: '/docs/',
            trailingSlash: false,
            onBrokenLinks: 'warn',
            onBrokenMarkdownLinks: 'warn',
            favicon: 'img/favicon.ico',
            organizationName: 'biyani701',
            projectName: 'portfolio',

            // Add scripts to include on every page
            scripts: [
              {
                src: '/docs/js/docusaurus-router.js',
                async: false,
              },
              {
                src: '/docs/js/theme-init.js',
                async: false,
              },
            ],

            presets: [
              [
                'classic',
                /** @type {import('@docusaurus/preset-classic').Options} */
                ({
                  docs: {
                    routeBasePath: '/',
                    sidebarPath: './sidebars.js',
                    editUrl: 'https://github.com/biyani701/portfolio/tree/main/docs/',
                    remarkPlugins: [
                      ['@docusaurus/remark-plugin-npm2yarn', {sync: true}],
                    ],
                  },
                  theme: {
                    customCss: './src/css/custom.css',
                  },
                }),
              ],
            ],

            // Add Mermaid support
            markdown: {
              mermaid: true,
            },

            themes: ['@docusaurus/theme-mermaid'],

            themeConfig:
              /** @type {import('@docusaurus/preset-classic').ThemeConfig} */
              ({
                // Replace with your project's social card
                image: 'img/docusaurus-social-card.jpg',
                colorMode: {
                  defaultMode: 'light',
                  disableSwitch: true, // We're using our custom theme toggle
                  respectPrefersColorScheme: false,
                },
                navbar: {
                  title: 'Portfolio Docs',
                  logo: {
                    alt: 'Portfolio Logo',
                    src: 'img/logo.svg',
                  },
                  items: [
                    {
                      type: 'docSidebar',
                      sidebarId: 'tutorialSidebar',
                      position: 'left',
                      label: 'Documentation',
                    },
                    {to: 'https://vishal.biyani.xyz', label: 'Main Site', position: 'right'},
                    {
                      href: 'https://github.com/biyani701/portfolio',
                      label: 'GitHub',
                      position: 'right',
                    },
                  ],
                },
                footer: {
                  style: 'dark',
                  links: [
                    {
                      title: 'Documentation',
                      items: [
                        {
                          label: 'Introduction',
                          to: '/docs/intro',
                        },
                        {
                          label: 'Architecture',
                          to: '/docs/architecture/overview',
                        },
                        {
                          label: 'Libraries',
                          to: '/docs/libraries/mui',
                        },
                      ],
                    },
                    {
                      title: 'Policies',
                      items: [
                        {
                          label: 'Privacy Policy',
                          to: '/docs/policies/privacy-policy',
                        },
                        {
                          label: 'Terms of Use',
                          to: '/docs/policies/terms-of-use',
                        },
                        {
                          label: 'Security Policy',
                          to: '/docs/policies/security-policy',
                        },
                        {
                          label: 'Cookie Policy',
                          to: '/docs/policies/cookie-policy',
                        },
                      ],
                    },
                    {
                      title: 'Links',
                      items: [
                        {
                          label: 'Main Site',
                          href: 'https://vishal.biyani.xyz',
                        },
                        {
                          label: 'GitHub',
                          href: 'https://github.com/biyani701/portfolio',
                        },
                        {
                          label: 'LinkedIn',
                          href: 'https://www.linkedin.com/in/vishalbiyani2/',
                        },
                      ],
                    },
                  ],
                  copyright: `Copyright © ${new Date().getFullYear()} Vishal Biyani. All rights reserved.`,
                },
                prism: {
                  theme: lightCodeTheme,
                  darkTheme: darkCodeTheme,
                  additionalLanguages: ['bash', 'json', 'markdown', 'yaml', 'jsx', 'tsx'],
                },
                mermaid: {
                  theme: { light: 'neutral', dark: 'dark' },
                },
              }),
          };

          export default config;
          EOF

          # Create custom.css file with portfolio styling
          mkdir -p docs-site/src/css
          cat > docs-site/src/css/custom.css <<"EOF"
          /**
          * Any CSS included here will be global. The classic template
          * bundles Infima by default. Infima is a CSS framework designed to
          * work well for content-centric websites.
          */

          /* You can override the default Infima variables here. */
          :root {
            /* Light mode - Sunny Day palette */
            --ifm-color-primary: #FFEB3B;
            --ifm-color-primary-dark: #FFC107;
            --ifm-color-primary-darker: #F57F17;
            --ifm-color-primary-darkest: #E65100;
            --ifm-color-primary-light: #FFEE58;
            --ifm-color-primary-lighter: #FFF176;
            --ifm-color-primary-lightest: #FFF59D;

            --ifm-background-color: #FFFDE7;
            --ifm-navbar-background-color: #F57F17;
            --ifm-footer-background-color: #F57F17;

            --ifm-navbar-link-color: #FFFFFF;
            --ifm-footer-link-color: #FFFFFF;
            --ifm-footer-title-color: #FFFFFF;

            --ifm-code-font-size: 95%;
            --docusaurus-highlighted-code-line-bg: rgba(0, 0, 0, 0.1);

            /* Custom variables */
            --portfolio-header-height: 64px;
            --portfolio-footer-height: 60px;
          }

          /* For readability concerns, you should choose a lighter palette in dark mode. */
          [data-theme='dark'] {
            /* Dark mode - Blue Eclipse palette */
            --ifm-color-primary: #90CAF9;
            --ifm-color-primary-dark: #64B5F6;
            --ifm-color-primary-darker: #42A5F5;
            --ifm-color-primary-darkest: #1E88E5;
            --ifm-color-primary-light: #BBDEFB;
            --ifm-color-primary-lighter: #E3F2FD;
            --ifm-color-primary-lightest: #F5F9FF;

            --ifm-background-color: #121212;
            --ifm-navbar-background-color: #121212;
            --ifm-footer-background-color: #121212;

            --ifm-navbar-link-color: #E0E0E0;
            --ifm-footer-link-color: #E0E0E0;
            --ifm-footer-title-color: #E0E0E0;

            --docusaurus-highlighted-code-line-bg: rgba(0, 0, 0, 0.3);
          }

          /* Navbar styling */
          .navbar {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            height: var(--portfolio-header-height);
          }

          .navbar__link {
            font-weight: 500;
            transition: all 0.3s ease;
          }

          .navbar__link:hover {
            opacity: 0.8;
            transform: translateY(-2px);
          }

          .navbar__brand {
            font-weight: 700;
          }

          /* Footer styling */
          .footer {
            padding: 2rem 0;
            height: var(--portfolio-footer-height);
            border-top: 1px solid var(--ifm-color-emphasis-300);
          }

          .footer__link-item {
            transition: all 0.3s ease;
          }

          .footer__link-item:hover {
            text-decoration: underline;
            opacity: 0.8;
          }

          .footer__copyright {
            font-size: 0.875rem;
            opacity: 0.8;
          }

          /* Button styling */
          .button {
            border-radius: 8px;
            text-transform: none;
            font-weight: 500;
            transition: all 0.3s ease;
          }

          .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
          }

          /* Card styling */
          .card {
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
          }

          .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
          }

          /* Markdown content styling */
          .markdown {
            --ifm-heading-font-weight: 600;
          }

          .markdown h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
          }

          .markdown h2 {
            font-size: 2rem;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--ifm-color-emphasis-200);
          }

          .markdown h3 {
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
          }

          .markdown code {
            border-radius: 4px;
            padding: 0.2rem 0.4rem;
          }

          /* Responsive adjustments */
          @media (max-width: 768px) {
            .navbar {
              height: 56px;
            }

            .footer {
              padding: 1rem 0;
            }

            .markdown h1 {
              font-size: 2rem;
            }

            .markdown h2 {
              font-size: 1.75rem;
            }

            .markdown h3 {
              font-size: 1.25rem;
            }
          }
          EOF

          # Create custom sidebars.js file with policy pages
          cat > docs-site/sidebars.js <<"EOF"
          /**
          * Creating a sidebar enables you to:
          - create an ordered group of docs
          - render a sidebar for each doc of that group
          - provide next/previous navigation

          The sidebars can be generated from the filesystem, or explicitly defined here.

          Create as many sidebars as you want.
          */

          // @ts-check

          /** @type {import('@docusaurus/plugin-content-docs').SidebarsConfig} */
          const sidebars = {
            tutorialSidebar: [
              {
                type: 'category',
                label: 'Introduction',
                items: ['intro'],
              },
              {
                type: 'category',
                label: 'Architecture',
                items: ['architecture/overview'],
              },
              {
                type: 'category',
                label: 'Libraries',
                items: ['libraries/mui'],
              },
              {
                type: 'category',
                label: 'Development',
                items: ['development/eslint-version'],
              },
              {
                type: 'category',
                label: 'SBOM',
                items: ['sbom/dependencies'],
              },
              {
                type: 'category',
                label: 'Policies',
                items: [
                  'policies/privacy-policy',
                  'policies/terms-of-use',
                  'policies/security-policy',
                  'policies/cookie-policy',
                  'policies/eula',
                ],
              },
            ],
          };

          export default sidebars;
          EOF

          # Create basic static files. No need directory already exists
          # mkdir -p docs-site/static/img

          # Create a simple logo.svg
          cat > docs-site/static/img/logo.svg <<"EOF"
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <svg width="200" height="200" viewBox="0 0 200 200" version="1.1" id="portfolio-logo" xmlns="http://www.w3.org/2000/svg">
            <rect style="fill:#2e8555;fill-opacity:1;stroke:none" width="200" height="200" x="0" y="0" rx="20" ry="20" />
            <text style="font-size:120px;fill:#ffffff" x="50" y="140">V</text>
          </svg>
          EOF

          # Create empty placeholder files for other required static assets
          touch docs-site/static/img/favicon.ico
          touch docs-site/static/img/docusaurus-social-card.jpg

          # Create custom theme components
          mkdir -p docs-site/src/components/ThemeToggle
          cat > docs-site/src/components/ThemeToggle/index.js <<"EOF"
          import * as React from 'react';
          import { useEffect, useState } from 'react';
          import { useColorMode } from '@docusaurus/theme-common/internal';
          import styles from './styles.module.css';

          export default function ThemeToggle() {
            const { colorMode, setColorMode } = useColorMode();
            const [mounted, setMounted] = useState(false);

            // The Docusaurus theme system is client-side only, so we need to make sure
            // we don't render this component on the server
            useEffect(() => {
              setMounted(true);
            }, []);

            // Save theme preference to cookies when it changes
            useEffect(() => {
              if (mounted) {
                // Set cookie with 365 days expiry
                const expiryDate = new Date();
                expiryDate.setDate(expiryDate.getDate() + 365);

                // Use secure cookies with proper attributes
                const cookieOptions = "expires=" + expiryDate.toUTCString() + "; path=/; SameSite=Strict" +
                  (window.location.protocol === 'https:' ? '; Secure' : '');

                document.cookie = "themeMode=" + colorMode + "; " + cookieOptions;
                console.log("Theme preference saved to cookie: mode=" + colorMode);
              }
            }, [colorMode, mounted]);

            const toggleTheme = () => {
              setColorMode(colorMode === 'dark' ? 'light' : 'dark');
            };

            if (!mounted) {
              // Don't render anything until client-side hydration is complete
              return null;
            }

            return (
              <button
                onClick={toggleTheme}
                className={styles.themeToggle}
                title={"Switch to " + (colorMode === 'dark' ? 'light' : 'dark') + " mode"}
                aria-label={"Switch to " + (colorMode === 'dark' ? 'light' : 'dark') + " mode"}
              >
                {colorMode === 'dark' ? (
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      fillRule="evenodd"
                      clipRule="evenodd"
                      d="M12 17C14.7614 17 17 14.7614 17 12C17 9.23858 14.7614 7 12 7C9.23858 7 7 9.23858 7 12C7 14.7614 9.23858 17 12 17ZM12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z"
                      fill="currentColor"
                    />
                    <path
                      fillRule="evenodd"
                      clipRule="evenodd"
                      d="M12 5C12.5523 5 13 4.55228 13 4V2C13 1.44772 12.5523 1 12 1C11.4477 1 11 1.44772 11 2V4C11 4.55228 11.4477 5 12 5Z"
                      fill="currentColor"
                    />
                    <path
                      fillRule="evenodd"
                      clipRule="evenodd"
                      d="M12 23C12.5523 23 13 22.5523 13 22V20C13 19.4477 12.5523 19 12 19C11.4477 19 11 19.4477 11 20V22C11 22.5523 11.4477 23 12 23Z"
                      fill="currentColor"
                    />
                    <path
                      fillRule="evenodd"
                      clipRule="evenodd"
                      d="M5 12C5 11.4477 4.55228 11 4 11H2C1.44772 11 1 11.4477 1 12C1 12.5523 1.44772 13 2 13H4C4.55228 13 5 12.5523 5 12Z"
                      fill="currentColor"
                    />
                    <path
                      fillRule="evenodd"
                      clipRule="evenodd"
                      d="M23 12C23 11.4477 22.5523 11 22 11H20C19.4477 11 19 11.4477 19 12C19 12.5523 19.4477 13 20 13H22C22.5523 13 23 12.5523 23 12Z"
                      fill="currentColor"
                    />
                  </svg>
                ) : (
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      fillRule="evenodd"
                      clipRule="evenodd"
                      d="M12.2256 2.00253C9.59172 1.94346 6.93894 2.9189 4.92893 4.92891C1.02369 8.83415 1.02369 15.1658 4.92893 19.071C8.83418 22.9763 15.1658 22.9763 19.0711 19.071C21.0811 17.061 22.0565 14.4082 21.9975 11.7743C21.9796 10.9772 21.8669 10.1818 21.6595 9.40643C21.0933 9.9488 20.3275 10.2636 19.5 10.2636C17.8431 10.2636 16.5 8.92051 16.5 7.26364C16.5 6.43612 16.8148 5.67034 17.3572 5.10418C16.5818 4.89677 15.7864 4.78414 14.9893 4.76623C14.1924 4.74832 13.3877 4.86649 12.6108 5.11029C11.8338 5.35409 11.0998 5.72209 10.4407 6.20046C9.78165 6.67882 9.21038 7.26184 8.75321 7.92197C7.83853 9.29209 7.42511 10.9206 7.57253 12.5603C7.72005 14.1999 8.41898 15.7433 9.55557 16.8799C10.6922 18.0165 12.2355 18.7154 13.8752 18.8629C15.5148 19.0103 17.1433 18.5969 18.5135 17.6822C19.1736 17.225 19.7566 16.6538 20.235 15.9947C20.7133 15.3356 21.0813 14.6016 21.3251 13.8246C21.5689 13.0476 21.6871 12.243 21.6692 11.4461C21.6532 10.6835 21.5458 9.92309 21.3482 9.18407C21.1506 8.44505 20.8663 7.73171 20.4999 7.06241C20.1336 6.39311 19.6886 5.77206 19.1777 5.22109C18.6667 4.67012 18.0956 4.19486 17.4644 3.80854C16.8332 3.42222 16.1481 3.12612 15.4372 2.92856C14.7262 2.73101 13.9953 2.63331 13.2616 2.63773C12.9136 2.64058 12.5672 2.65973 12.2256 2.00253Z"
                      fill="currentColor"
                    />
                  </svg>
                )}
              </button>
            );
          }
          EOF

          cat > docs-site/src/components/ThemeToggle/styles.module.css <<"EOF"
          .themeToggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: transparent;
            border: none;
            cursor: pointer;
            color: var(--ifm-navbar-link-color);
            transition: all 0.3s ease;
            padding: 0;
            margin-left: 8px;
          }

          .themeToggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
          }

          .themeToggle:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--ifm-color-primary);
          }

          /* Animation for the toggle */
          .themeToggle svg {
            transition: transform 0.3s ease;
          }

          .themeToggle:hover svg {
            transform: rotate(30deg);
          }
          EOF

          # Create custom Navbar component
          mkdir -p docs-site/src/theme/Navbar
          cat > docs-site/src/theme/Navbar/index.js <<"EOF"
          import * as React from 'react';
          import Navbar from '@theme-original/Navbar';
          import ThemeToggle from '../../components/ThemeToggle';
          import styles from './styles.module.css';

          export default function NavbarWrapper(props) {
            return (
              <div className={styles.navbarWrapper}>
                <Navbar {...props} />
                <div className={styles.themeToggleWrapper}>
                  <ThemeToggle />
                </div>
              </div>
            );
          }
          EOF

          cat > docs-site/src/theme/Navbar/styles.module.css <<"EOF"
          .navbarWrapper {
            position: relative;
          }

          .themeToggleWrapper {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
          }

          /* Adjust position for mobile */
          @media (max-width: 996px) {
            .themeToggleWrapper {
              right: 70px; /* Leave space for the mobile menu button */
            }
          }
          EOF

      - name: Install Docusaurus dependencies
        run: |
          cd docs-site
          echo "Installing Docusaurus dependencies..."

          # Create package.json with required dependencies
          cat > package.json <<"EOF"
          {
            "name": "portfolio-docs",
            "version": "0.1.0",
            "private": true,
            "homepage": "/docs/",
            "scripts": {
              "docusaurus": "docusaurus",
              "start": "docusaurus start",
              "build": "docusaurus build",
              "swizzle": "docusaurus swizzle",
              "deploy": "docusaurus deploy",
              "clear": "docusaurus clear",
              "serve": "docusaurus serve",
              "write-translations": "docusaurus write-translations",
              "write-heading-ids": "docusaurus write-heading-ids"
            },
            "dependencies": {
              "@docusaurus/core": "^3.7.0",
              "@docusaurus/preset-classic": "^3.7.0",
              "@docusaurus/theme-mermaid": "^3.7.0",
              "@docusaurus/remark-plugin-npm2yarn": "^3.7.0",
              "@mdx-js/react": "^3.0.0",
              "clsx": "^2.1.0",
              "prism-react-renderer": "^2.3.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0"
            },
            "devDependencies": {
              "@docusaurus/module-type-aliases": "^3.7.0"
            },
            "browserslist": {
              "production": [
                ">0.5%",
                "not dead",
                "not op_mini all"
              ],
              "development": [
                "last 1 chrome version",
                "last 1 firefox version",
                "last 1 safari version"
              ]
            },
            "engines": {
              "node": ">=18.0",
              "npm": ">=8.0.0"
            }
          }
          EOF

          npm install

      - name: Build Docusaurus
        run: |
          cd docs-site
          echo "Building Docusaurus site..."
          npm run build

          # Create .nojekyll file to prevent GitHub Pages processing
          touch ./build/.nojekyll

          echo "Docusaurus build completed."
          echo "Contents of build directory:"
          pwd
          ls -la
          ls -la build || { echo "❌ build/ directory does not exist. Build likely failed."; exit 1; }

          # No need to copy files here, we'll do it in a separate step
          echo "Docusaurus build completed successfully."

      # Add a debugging script to help diagnose issues
      - name: Add diagnostics script
        run: |
          echo "Directory structure in .. $(pwd)"
          find docs-site \( -path '*/node_modules' -o -path '*/.docusaurus' \) -prune -o -type d -print | sort

          # We'll add the diagnostics script in the final copy step

      # Create redirect placeholders for common paths
      - name: Create redirect for common paths
        run: |
          # Create a placeholder for /docs
          cat > ./build/docs.html <<"EOF"
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=/docs/">
            <title>Redirecting to Documentation</title>
          </head>
          <body>
            <p>Redirecting to documentation... <a href="/docs/">Click here if you're not redirected</a></p>
          </body>
          </html>
          EOF

          # We'll handle the redirect in the copy step instead
      - name: List build output
        run: |
          ls -R ./docs-site/build

      # Copy Docusaurus build to the main build directory
      - name: Copy Docusaurus build to main build directory
        run: |
          echo "Copying Docusaurus build to main build/docs directory..."
          mkdir -p ./build/docs

          # Save the original index.html from docs-site if it exists
          if [ -f "./docs-site/build/index.html" ]; then
            echo "Saving original Docusaurus index.html"
            cp ./docs-site/build/index.html ./docs-site/build/docs-index.html
          fi

          # Copy all files from docs-site/build to build/docs
          cp -r ./docs-site/build/* ./build/docs/

          # Create a proper index.html in the docs directory that loads the Docusaurus site
          echo "Creating index.html in docs directory"
          if [ -f "./docs-site/build/docs-index.html" ]; then
            cp ./docs-site/build/docs-index.html ./build/docs/index.html
          fi

          # Add diagnostics script
          cat > ./build/docs/diagnostics.js <<"EOF"
          // Diagnostic script to help troubleshoot Docusaurus issues
          console.log('📊 Running diagnostics for Docusaurus site');

          // List all loaded scripts
          const scripts = document.querySelectorAll('script');
          console.log('📜 Loaded scripts:');
          scripts.forEach((script, index) => {
            console.log(`${index + 1}. ${script.src || '(inline script)'}`);
          });

          // Check if key Docusaurus elements exist
          console.log('🔍 Checking for key Docusaurus elements:');
          const navbar = document.querySelector('nav.navbar');
          console.log(`Navbar: ${navbar ? '✅ Found' : '❌ Not found'}`);

          const sidebar = document.querySelector('div.theme-doc-sidebar-container');
          console.log(`Sidebar: ${sidebar ? '✅ Found' : '❌ Not found'}`);

          const mainContent = document.querySelector('main.container');
          console.log(`Main content: ${mainContent ? '✅ Found' : '❌ Not found'}`);

          // Check for stylesheets
          const stylesheets = document.querySelectorAll('link[rel="stylesheet"]');
          console.log('🎨 Loaded stylesheets:');
          stylesheets.forEach((stylesheet, index) => {
            console.log(`${index + 1}. ${stylesheet.href}`);
          });

          // List all resources that failed to load
          console.log('❌ Failed resources:');
          if (window.performance) {
            const resources = window.performance.getEntriesByType('resource');
            let failedCount = 0;
            resources.forEach(resource => {
              // Approximation: resources with very small transfer sizes might have failed
              if (resource.transferSize < 100 && !resource.name.includes('favicon')) {
                console.log(`- ${resource.name}`);
                failedCount++;
              }
            });
            if (failedCount === 0) {
              console.log('None detected');
            }
          }

          console.log('📊 Diagnostics complete');
          EOF

          # Add the diagnostics script to the docs index.html
          if [ -f "./build/docs/index.html" ]; then
            echo "Adding diagnostics script to docs/index.html"
            sed -i 's/<\/body>/<script src="diagnostics.js"><\/script><\/body>/' ./build/docs/index.html
          else
            echo "❌ docs/index.html not found. Diagnostics script not added."
          fi

          # Verify the contents
          echo "Contents of build directory:"
          ls -la ./build
          echo "Contents of build/docs directory:"
          ls -la ./build/docs

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: vishal.biyani.xyz