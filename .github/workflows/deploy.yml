name: Deploy to Production
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      # Portfolio Build and Setup
      - name: Install portfolio dependencies
        run: npm ci

      - name: Build the portfolio project
        run: npm run build
        env:
          REACT_APP_GITHUB_CLIENT_ID: ${{ vars.REACT_APP_GITHUB_CLIENT_ID }}
          REACT_APP_REDIRECT_URI: ${{ vars.REACT_APP_REDIRECT_URI }}
          REACT_APP_TOKEN_PROXY_URL: ${{ vars.REACT_APP_TOKEN_PROXY_URL }}

      # Copy 404.html to build folder for main site
      - name: Copy 404.html for main site
        run: |
          if [ -f "public/404.html" ]; then
            echo "Copying 404.html from public directory"
            cp public/404.html build/
          else
            echo "Creating 404.html in build directory"
            cat > build/404.html <<"EOF"
            <!DOCTYPE html>
            <html>
              <head>
                <meta charset="utf-8" />
                <script type="text/javascript">
                  (function () {
                    const search = window.location.search;
                    const params = new URLSearchParams(search);
                    const redirect = params.get("redirect") || "/";
                    window.location.replace(redirect);
                  })();
                </script>
              </head>
              <body>
                <p>Redirecting... If you are not redirected automatically, <a href="/">click here</a>.</p>
              </body>
            </html>
          EOF
          fi


      # Create docs directory and basic index.html
      - name: Create basic docs index
        run: |
          mkdir -p build/docs
          cat > build/docs/index.html <<"EOF"
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="0;url=/docs/">
            <title>Portfolio Documentation</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 20px;
                text-align: center;
              }
              .loading {
                display: inline-block;
                margin-top: 20px;
              }
              .loading:after {
                content: " .";
                animation: dots 1.5s steps(5, end) infinite;
              }
              @keyframes dots {
                0%, 20% { content: " ."; }
                40% { content: " .."; }
                60% { content: " ..."; }
                80%, 100% { content: " ...."; }
              }
            </style>
          </head>
          <body>
            <h1>Portfolio Documentation</h1>
            <p>Loading documentation<span class="loading"></span></p>
            <p>If you are not redirected automatically, <a href="/docs/">click here</a>.</p>
          </body>
          </html>
          EOF

      # Docusaurus Setup and Build
      - name: Setup Docusaurus
        run: |
          echo "Creating Docusaurus site..."
          npx create-docusaurus@latest docs-site classic --skip-install

          echo "Creating necessary directories..."
          mkdir -p docs-site/docs
          mkdir -p docs-site/static/img
          mkdir -p docs-site/src/css
          mkdir -p docs-site/static/js

          # Create docusaurus-router.js for handling navigation
          cat > docs-site/static/js/docusaurus-router.js <<"EOF"
          // This script helps with handling client-side routing within Docusaurus
          (function() {
            console.log('📚 Docusaurus router script loaded');

            // Check if we're in the docs section
            if (window.location.pathname.startsWith('/docs/')) {
              console.log('✅ Initialized docusaurus router');

              // Add a listener for handle Docusaurus navigation
              window.addEventListener('load', function() {
                console.log('🔄 Docusaurus page loaded completely');
              });
            }
          })();
          EOF

          echo "Examining docs directory structure..."
          find docs -type f | sort || echo "No docs directory found"

          # Copy docs content if it exists
          if [ -d "docs/docs" ]; then
            echo "Copying docs content..."
            cp -r docs/docs/* docs-site/docs/
          else
            echo "Creating basic docs content..."

            # Create a basic intro file
            mkdir -p docs-site/docs
            echo '---' > docs-site/docs/intro.md
            echo 'sidebar_position: 1' >> docs-site/docs/intro.md
            echo '---' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '# Portfolio Documentation' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo 'Welcome to the documentation for the Portfolio project.' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Overview' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo 'The Portfolio project is a personal website built with React and Material-UI.' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Features' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '- Resume Sections' >> docs-site/docs/intro.md
            echo '- Blog' >> docs-site/docs/intro.md
            echo '- Knowledge Base' >> docs-site/docs/intro.md
            echo '- Authentication' >> docs-site/docs/intro.md
            echo '- Responsive Design' >> docs-site/docs/intro.md
          fi

          # Update docusaurus.config.js with proper settings
          cat > docs-site/docusaurus.config.js <<"EOF"
          // @ts-check
          // `@type` JSDoc annotations allow editor autocompletion and type checking
          // (when paired with `@ts-check`).

          /** @type {import('@docusaurus/types').Config} */
          const config = {
            title: 'Portfolio Documentation',
            tagline: 'Documentation for the portfolio project',
            url: 'https://vishal.biyani.xyz',
            baseUrl: '/docs/',
            trailingSlash: false,
            onBrokenLinks: 'warn',
            onBrokenMarkdownLinks: 'warn',
            favicon: 'img/favicon.ico',
            organizationName: 'biyani701',
            projectName: 'portfolio',

            // Add scripts to include on every page
            scripts: [
              {
                src: '/docs/js/docusaurus-router.js',
                async: false,
              },
            ],

            presets: [
              [
                'classic',
                /** @type {import('@docusaurus/preset-classic').Options} */
                ({
                  docs: {
                    routeBasePath: '/',
                    sidebarPath: require.resolve('./sidebars.js'),
                    editUrl: 'https://github.com/biyani701/portfolio/tree/main/docs/',
                  },
                  theme: {
                    customCss: require.resolve('./src/css/custom.css'),
                  },
                }),
              ],
            ],

            themeConfig:
              /** @type {import('@docusaurus/preset-classic').ThemeConfig} */
              ({
                navbar: {
                  title: 'Portfolio Docs',
                  logo: {
                    alt: 'Portfolio Logo',
                    src: 'img/logo.svg',
                  },
                  items: [
                    {
                      type: 'docSidebar',
                      sidebarId: 'tutorialSidebar',
                      position: 'left',
                      label: 'Documentation',
                    },
                    {
                      href: '/',
                      label: 'Back to Portfolio',
                      position: 'right',
                    },
                    {
                      href: 'https://github.com/biyani701/portfolio',
                      label: 'GitHub',
                      position: 'right',
                    },
                  ],
                },
                footer: {
                  style: 'dark',
                  links: [
                    {
                      title: 'Docs',
                      items: [
                        {
                          label: 'Getting Started',
                          to: '/',
                        },
                      ],
                    },
                    {
                      title: 'More',
                      items: [
                        {
                          label: 'Portfolio',
                          href: '/',
                        },
                        {
                          label: 'GitHub',
                          href: 'https://github.com/biyani701/portfolio',
                        },
                      ],
                    },
                  ],
                  copyright: `Copyright © ${new Date().getFullYear()} Vishal Biyani. Built with Docusaurus.`,
                },
                prism: {
                  theme: require('prism-react-renderer').themes.github,
                  darkTheme: require('prism-react-renderer').themes.dracula,
                },
              }),
          };

          module.exports = config;
          EOF

          # Create basic custom.css file
          cat > docs-site/src/css/custom.css <<"EOF"
          /**
          * Any CSS included here will be global. The classic template
          * bundles Infima by default. Infima is a CSS framework designed to
          * work well for content-centric websites.
          */

          /* You can override the default Infima variables here. */
          :root {
            --ifm-color-primary: #2e8555;
            --ifm-color-primary-dark: #29784c;
            --ifm-color-primary-darker: #277148;
            --ifm-color-primary-darkest: #205d3b;
            --ifm-color-primary-light: #33925d;
            --ifm-color-primary-lighter: #359962;
            --ifm-color-primary-lightest: #3cad6e;
            --ifm-code-font-size: 95%;
            --docusaurus-highlighted-code-line-bg: rgba(0, 0, 0, 0.1);
          }

          /* For readability concerns, you should choose a lighter palette in dark mode. */
          [data-theme="dark"] {
            --ifm-color-primary: #25c2a0;
            --ifm-color-primary-dark: #21af90;
            --ifm-color-primary-darker: #1fa588;
            --ifm-color-primary-darkest: #1a8870;
            --ifm-color-primary-light: #29d5b0;
            --ifm-color-primary-lighter: #32d8b4;
            --ifm-color-primary-lightest: #4fddbf;
            --docusaurus-highlighted-code-line-bg: rgba(0, 0, 0, 0.3);
          }
          EOF

          # Create basic sidebars.js file
          cat > docs-site/sidebars.js <<"EOF"
          /**
          * Creating a sidebar enables you to:
          - create an ordered group of docs
          - render a sidebar for each doc of that group
          - provide next/previous navigation

          The sidebars can be generated from the filesystem, or explicitly defined here.

          Create as many sidebars as you want.
          */

          // @ts-check

          /** @type {import('@docusaurus/plugin-content-docs').SidebarsConfig} */
          const sidebars = {
            // By default, Docusaurus generates a sidebar from the docs folder structure
            tutorialSidebar: [{type: 'autogenerated', dirName: '.'}],
          };

          module.exports = sidebars;
          EOF

          # Create basic static files
          mkdir -p docs-site/static/img

          # Create a simple logo.svg
          cat > docs-site/static/img/logo.svg <<"EOF"
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <svg width="200" height="200" viewBox="0 0 200 200" version="1.1" id="portfolio-logo" xmlns="http://www.w3.org/2000/svg">
            <rect style="fill:#2e8555;fill-opacity:1;stroke:none" width="200" height="200" x="0" y="0" rx="20" ry="20" />
            <text style="font-size:120px;fill:#ffffff" x="50" y="140">V</text>
          </svg>
          EOF

          # Create empty placeholder files for other required static assets
          touch docs-site/static/img/favicon.ico
          touch docs-site/static/img/docusaurus-social-card.jpg

      - name: Install Docusaurus dependencies
        run: |
          cd docs-site
          echo "Installing Docusaurus dependencies..."
          npm install

      - name: Build Docusaurus
        run: |
          cd docs-site
          echo "Building Docusaurus site..."
          npm run build
          echo "Docusaurus build completed."
          echo "Contents of build directory:"
          ls -la build || { echo "❌ build/ directory does not exist. Build likely failed."; exit 1; }

          # Create .nojekyll file to prevent GitHub Pages processing
          touch ./build/.nojekyll

          # Copy built files to the main build/docs directory
          echo "Copying built files to main build/docs directory..."
          cp -r build/* ../build/docs/

          # Ensure the router script is available
          if [ -f "../build/docs/js/docusaurus-router.js" ]; then
            echo "✅ Router script exists at the correct location"
          else
            echo "⚠️ Router script not found, creating it..."
            mkdir -p ../build/docs/js
            cp static/js/docusaurus-router.js ../build/docs/js/
          fi

      # Add a debugging script to help diagnose issues
      - name: Add diagnostics script
        run: |
          cat > build/docs/diagnostics.js <<"EOF"
          // Diagnostic script to help troubleshoot Docusaurus issues
          console.log('📊 Running diagnostics for Docusaurus site');

          // List all loaded scripts
          const scripts = document.querySelectorAll('script');
          console.log('📜 Loaded scripts:');
          scripts.forEach((script, index) => {
            console.log(`${index + 1}. ${script.src || '(inline script)'}`);
          });

          // Check if key Docusaurus elements exist
          console.log('🔍 Checking for key Docusaurus elements:');
          const navbar = document.querySelector('nav.navbar');
          console.log(`Navbar: ${navbar ? '✅ Found' : '❌ Not found'}`);

          const sidebar = document.querySelector('div.theme-doc-sidebar-container');
          console.log(`Sidebar: ${sidebar ? '✅ Found' : '❌ Not found'}`);

          const mainContent = document.querySelector('main.container');
          console.log(`Main content: ${mainContent ? '✅ Found' : '❌ Not found'}`);

          // Check for stylesheets
          const stylesheets = document.querySelectorAll('link[rel="stylesheet"]');
          console.log('🎨 Loaded stylesheets:');
          stylesheets.forEach((stylesheet, index) => {
            console.log(`${index + 1}. ${stylesheet.href}`);
          });

          // List all resources that failed to load
          console.log('❌ Failed resources:');
          if (window.performance) {
            const resources = window.performance.getEntriesByType('resource');
            let failedCount = 0;
            resources.forEach(resource => {
              // Approximation: resources with very small transfer sizes might have failed
              if (resource.transferSize < 100 && !resource.name.includes('favicon')) {
                console.log(`- ${resource.name}`);
                failedCount++;
              }
            });
            if (failedCount === 0) {
              console.log('None detected');
            }
          }

          console.log('📊 Diagnostics complete');
          EOF

          # Add the diagnostics script to the docs index.html
          if [ -f "build/docs/index.html" ]; then
            echo "Adding diagnostics script to docs/index.html"
            sed -i 's/<\/body>/<script src="diagnostics.js"><\/script><\/body>/' build/docs/index.html
          fi

      # Create redirect placeholders for common paths
      - name: Create redirect for common paths
        run: |
          # Create a placeholder for /docs
          cat > build/docs.html <<"EOF"
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0;url=/docs/">
              <title>Redirecting to Documentation</title>
            </head>
            <body>
              <p>Redirecting to documentation... <a href="/docs/">Click here if you're not redirected</a></p>
            </body>
            </html>
          EOF

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: vishal.biyani.xyz