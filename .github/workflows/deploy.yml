name: Deploy to Production
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      # Portfolio Build and Setup
      - name: Install portfolio dependencies
        run: npm ci

      - name: Build the portfolio project
        run: npm run build
        env:
          REACT_APP_GITHUB_CLIENT_ID: ${{ vars.REACT_APP_GITHUB_CLIENT_ID }}
          REACT_APP_REDIRECT_URI: ${{ vars.REACT_APP_REDIRECT_URI }}
          REACT_APP_TOKEN_PROXY_URL: ${{ vars.REACT_APP_TOKEN_PROXY_URL }}

      # Docusaurus Setup and Build
      - name: Setup Docusaurus
        run: |
          echo "Creating Docusaurus site..."
          npx create-docusaurus@latest docs-site classic --skip-install

          echo "Creating necessary directories..."
          mkdir -p docs-site/docs
          mkdir -p docs-site/static/img

          echo "Examining docs directory structure..."
          find docs -type f | sort

          # Copy docs content if it exists
          if [ -d "docs/docs" ]; then
            echo "Copying docs content..."
            cp -r docs/docs/* docs-site/docs/
            echo "Contents of docs-site/docs after copying:"
            find docs-site/docs -type f | sort
          else
            echo "WARNING: docs/docs directory not found"
          fi

          # Copy config files if they exist
          if [ -f "docs/docusaurus.config.js" ]; then
            echo "Copying docusaurus.config.js..."
            cp docs/docusaurus.config.js docs-site/
            echo "Contents of copied docusaurus.config.js:"
            grep -n "baseUrl\|trailingSlash" docs-site/docusaurus.config.js || echo "baseUrl or trailingSlash not found"
          else
            echo "WARNING: docs/docusaurus.config.js not found"
            # Create a basic config with correct baseUrl
            echo "const config = {"                                  > docs-site/docusaurus.config.js
            echo "  title: 'Portfolio Documentation',"              >> docs-site/docusaurus.config.js
            echo "  tagline: 'Documentation for the portfolio',"   >> docs-site/docusaurus.config.js
            echo "  url: 'https://vishal.biyani.xyz',"              >> docs-site/docusaurus.config.js
            echo "  baseUrl: '/docs/',"                             >> docs-site/docusaurus.config.js
            echo "  trailingSlash: false,"                          >> docs-site/docusaurus.config.js
            echo "  onBrokenLinks: 'warn',"                         >> docs-site/docusaurus.config.js
            echo "  onBrokenMarkdownLinks: 'warn',"                 >> docs-site/docusaurus.config.js
            echo "  organizationName: 'biyani701',"                 >> docs-site/docusaurus.config.js
            echo "  projectName: 'portfolio',"                      >> docs-site/docusaurus.config.js
            echo "};"                                               >> docs-site/docusaurus.config.js
            echo "module.exports = config;"                         >> docs-site/docusaurus.config.js
          fi

          if [ -f "docs/sidebars.js" ]; then
            echo "Copying sidebars.js..."
            cp docs/sidebars.js docs-site/
          else
            echo "WARNING: docs/sidebars.js not found"
          fi

          # Create a basic intro file if it doesn't exist
          if [ ! -f "docs-site/docs/intro.md" ]; then
            echo "Creating basic intro.md..."
            mkdir -p docs-site/docs
            echo '---' > docs-site/docs/intro.md
            echo 'sidebar_position: 1' >> docs-site/docs/intro.md
            echo '---' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '# Portfolio Documentation' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo 'Welcome to the documentation for the Portfolio project.' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Overview' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo 'The Portfolio project is a personal website built with React and Material-UI.' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Features' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '- Resume Sections' >> docs-site/docs/intro.md
            echo '- Blog' >> docs-site/docs/intro.md
            echo '- Knowledge Base' >> docs-site/docs/intro.md
            echo '- Authentication' >> docs-site/docs/intro.md
            echo '- Responsive Design' >> docs-site/docs/intro.md
          fi

          # List directories for debugging
          echo "Final contents of docs-site directory:"
          find docs-site -type f | sort

      - name: Install Docusaurus dependencies
        run: |
          cd docs-site
          echo "Installing Docusaurus dependencies..."
          npm install

      - name: Build Docusaurus
        run: |
          cd docs-site
          echo "Building Docusaurus site..."
          npm run build || echo "Docusaurus build failed but continuing deployment"
          
          if [ -d "build" ]; then
            echo "Docusaurus build succeeded. Contents of build directory:"
            find build -type f | sort
          else
            echo "WARNING: Docusaurus build directory not found"
          fi