name: Deploy to Production
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      # Portfolio Build and Setup
      - name: Install portfolio dependencies
        run: npm ci

      - name: Build the portfolio project
        run: npm run build
        env:
          REACT_APP_GITHUB_CLIENT_ID: ${{ vars.REACT_APP_GITHUB_CLIENT_ID }}
          REACT_APP_REDIRECT_URI: ${{ vars.REACT_APP_REDIRECT_URI }}
          REACT_APP_TOKEN_PROXY_URL: ${{ vars.REACT_APP_TOKEN_PROXY_URL }}

      # Docusaurus Setup and Build
      - name: Setup Docusaurus
        run: |
          echo "Creating Docusaurus site..."
          npx create-docusaurus@latest docs-site classic --skip-install

          echo "Creating necessary directories..."
          mkdir -p docs-site/docs
          mkdir -p docs-site/static/img
          mkdir -p docs-site/src/css

          echo "Examining docs directory structure..."
          find docs -type f | sort

          # Copy docs content if it exists
          if [ -d "docs/docs" ]; then
            echo "Copying docs content..."
            cp -r docs/docs/* docs-site/docs/
            echo "Contents of docs-site/docs after copying:"
            find docs-site/docs -type f | sort
          else
            echo "WARNING: docs/docs directory not found"
          fi

          # Copy config files if they exist
          if [ -f "docs/docusaurus.config.js" ]; then
            echo "Copying docusaurus.config.js..."
            cp docs/docusaurus.config.js docs-site/
            echo "Contents of copied docusaurus.config.js:"
            grep -n "baseUrl\|trailingSlash" docs-site/docusaurus.config.js || echo "baseUrl or trailingSlash not found"
          else
            echo "WARNING: docs/docusaurus.config.js not found"
            # Create a basic config with correct baseUrl
            echo "const config = {"                                  > docs-site/docusaurus.config.js
            echo "  title: 'Portfolio Documentation',"              >> docs-site/docusaurus.config.js
            echo "  tagline: 'Documentation for the portfolio',"   >> docs-site/docusaurus.config.js
            echo "  url: 'https://vishal.biyani.xyz',"              >> docs-site/docusaurus.config.js
            echo "  baseUrl: '/docs/',"                             >> docs-site/docusaurus.config.js
            echo "  trailingSlash: false,"                          >> docs-site/docusaurus.config.js
            echo "  onBrokenLinks: 'warn',"                         >> docs-site/docusaurus.config.js
            echo "  onBrokenMarkdownLinks: 'warn',"                 >> docs-site/docusaurus.config.js
            echo "  organizationName: 'biyani701',"                 >> docs-site/docusaurus.config.js
            echo "  projectName: 'portfolio',"                      >> docs-site/docusaurus.config.js
            echo "};"                                               >> docs-site/docusaurus.config.js
            echo "module.exports = config;"                         >> docs-site/docusaurus.config.js
          fi

          if [ -f "docs/sidebars.js" ]; then
            echo "Copying sidebars.js..."
            cp docs/sidebars.js docs-site/
          else
            echo "WARNING: docs/sidebars.js not found"
          fi

          # Copy custom CSS file if it exists
          if [ -f "docs/src/css/custom.css" ]; then
            echo "Copying custom.css..."
            cp docs/src/css/custom.css docs-site/src/css/
          else
            echo "WARNING: docs/src/css/custom.css not found"
            # Create a basic custom.css file
            echo "Creating basic custom.css..."
            echo '/**
            * Any CSS included here will be global. The classic template
            * bundles Infima by default. Infima is a CSS framework designed to
            * work well for content-centric websites.
            */

          /* You can override the default Infima variables here. */
          :root {
            --ifm-color-primary: #2e8555;
            --ifm-color-primary-dark: #29784c;
            --ifm-color-primary-darker: #277148;
            --ifm-color-primary-darkest: #205d3b;
            --ifm-color-primary-light: #33925d;
            --ifm-color-primary-lighter: #359962;
            --ifm-color-primary-lightest: #3cad6e;
            --ifm-code-font-size: 95%;
            --docusaurus-highlighted-code-line-bg: rgba(0, 0, 0, 0.1);
          }

          /* For readability concerns, you should choose a lighter palette in dark mode. */
          [data-theme="dark"] {
            --ifm-color-primary: #25c2a0;
            --ifm-color-primary-dark: #21af90;
            --ifm-color-primary-darker: #1fa588;
            --ifm-color-primary-darkest: #1a8870;
            --ifm-color-primary-light: #29d5b0;
            --ifm-color-primary-lighter: #32d8b4;
            --ifm-color-primary-lightest: #4fddbf;
            --docusaurus-highlighted-code-line-bg: rgba(0, 0, 0, 0.3);
          }' > docs-site/src/css/custom.css
          fi

          # Copy package.json if it exists
          if [ -f "docs/package.json" ]; then
            echo "Copying package.json..."
            cp docs/package.json docs-site/
            echo "Contents of copied package.json:"
            grep -n "homepage" docs-site/package.json || echo "homepage not found in package.json"
          else
            echo "WARNING: docs/package.json not found"
            # Create a basic package.json with correct homepage
            echo "Creating basic package.json..."
            echo '{
            "name": "portfolio-docs",
            "version": "0.1.0",
            "private": true,
            "homepage": "/docs/",
            "scripts": {
              "docusaurus": "docusaurus",
              "start": "docusaurus start",
              "build": "docusaurus build",
              "swizzle": "docusaurus swizzle",
              "deploy": "docusaurus deploy",
              "clear": "docusaurus clear",
              "serve": "docusaurus serve",
              "write-translations": "docusaurus write-translations",
              "write-heading-ids": "docusaurus write-heading-ids"
            }
          }' > docs-site/package.json
          fi

          # Copy static files if they exist
          if [ -d "docs/static" ]; then
            echo "Copying static files..."
            cp -r docs/static/* docs-site/static/
            echo "Contents of static directory after copying:"
            find docs-site/static -type f | sort
          else
            echo "WARNING: docs/static directory not found"
            # Create basic static files
            echo "Creating basic static files..."
            mkdir -p docs-site/static/img

            # Create a simple logo.svg
            echo '<?xml version="1.0" encoding="UTF-8" standalone="no"?>
            <svg width="200" height="200" viewBox="0 0 200 200" version="1.1" id="portfolio-logo" xmlns="http://www.w3.org/2000/svg">
              <rect style="fill:#2e8555;fill-opacity:1;stroke:none" width="200" height="200" x="0" y="0" rx="20" ry="20" />
              <text style="font-size:120px;fill:#ffffff" x="50" y="140">V</text>
            </svg>' > docs-site/static/img/logo.svg

            # Create empty placeholder files for other required static assets
            touch docs-site/static/img/favicon.ico
            touch docs-site/static/img/docusaurus-social-card.jpg

            echo "Created basic static files:"
            find docs-site/static -type f | sort
          fi

          # Create a basic intro file if it doesn't exist
          if [ ! -f "docs-site/docs/intro.md" ]; then
            echo "Creating basic intro.md..."
            mkdir -p docs-site/docs
            echo '---' > docs-site/docs/intro.md
            echo 'sidebar_position: 1' >> docs-site/docs/intro.md
            echo '---' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '# Portfolio Documentation' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo 'Welcome to the documentation for the Portfolio project.' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Overview' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo 'The Portfolio project is a personal website built with React and Material-UI.' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '## Features' >> docs-site/docs/intro.md
            echo '' >> docs-site/docs/intro.md
            echo '- Resume Sections' >> docs-site/docs/intro.md
            echo '- Blog' >> docs-site/docs/intro.md
            echo '- Knowledge Base' >> docs-site/docs/intro.md
            echo '- Authentication' >> docs-site/docs/intro.md
            echo '- Responsive Design' >> docs-site/docs/intro.md
          fi

          # List directories for debugging
          echo "Final contents of docs-site directory:"
          find docs-site -type f | sort

      - name: Install Docusaurus dependencies
        run: |
          cd docs-site
          echo "Installing Docusaurus dependencies..."
          npm install

      - name: Build Docusaurus
        run: |
          cd docs-site
          echo "Building Docusaurus site..."
          npm run build || echo "Docusaurus build failed but continuing deployment"

          if [ -d "build" ]; then
            echo "Docusaurus build succeeded. Contents of build directory:"
            find build -type f | sort
          else
            echo "WARNING: Docusaurus build directory not found"
          fi

      # Prepare combined deployment
      - name: Prepare combined deployment
        run: |
          # Create docs directory in build
          mkdir -p build/docs

          # Check if Docusaurus build exists and copy it
          if [ -d "docs-site/build" ]; then
            echo "Copying Docusaurus build to build/docs"
            cp -r docs-site/build/* build/docs/ || echo "Warning: Could not copy Docusaurus build"

            # Create a .nojekyll file to prevent GitHub Pages from processing the site with Jekyll
            touch build/docs/.nojekyll

            # Verify the copy worked
            echo "Verifying copied files:"
            find build/docs -type f | sort
          else
            echo "Warning: Docusaurus build directory not found"
            # Use fallback index.html if it exists
            if [ -f "docs/fallback-index.html" ]; then
              echo "Using fallback index.html"
              cp docs/fallback-index.html build/docs/index.html
            else
              # Create a simple placeholder page
              echo "<html><head><title>Documentation</title></head><body><h1>Documentation</h1><p>Documentation is being set up. Please check back later.</p></body></html>" > build/docs/index.html
            fi
          fi

          # Create a special router.js file in the docs directory to handle navigation
          echo "Creating router.js for docs navigation"
          cat > build/docs/router.js << 'EOF'
          // This script handles routing within the docs subdirectory
          (function() {
            console.log('📚 Docs router.js loaded');

            // Check if we're in the docs directory
            if (window.location.pathname.startsWith('/docs/')) {
              // Get the path after /docs/
              const path = window.location.pathname.substring(6);

              // If we're at the root of docs, we're good
              if (path === '' || path === 'index.html') {
                console.log('📍 At docs root, no redirect needed');
                return;
              }

              // Check if the requested file exists
              fetch(path)
                .then(response => {
                  if (response.ok) {
                    console.log(`✅ File ${path} exists, no redirect needed`);
                  } else {
                    console.log(`❌ File ${path} not found, redirecting to index.html`);
                    window.location.href = '/docs/';
                  }
                })
                .catch(error => {
                  console.error('Error checking file:', error);
                  // On error, redirect to docs home
                  window.location.href = '/docs/';
                });
            }
          })();
          EOF

          # Add the router script to the docs index.html
          if [ -f "build/docs/index.html" ]; then
            echo "Adding router script to docs/index.html"
            sed -i 's/<\/head>/<script src="router.js"><\/script><\/head>/' build/docs/index.html
          fi

          # List contents for debugging
          echo "Final contents of build/docs directory:"
          find build/docs -type f | head -n 20 || echo "Could not list build/docs directory"

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: vishal.biyani.xyz